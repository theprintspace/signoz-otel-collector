name: Deploy to staging

on:
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read
  packages: write

# Per-service deploy workflow for signoz-otel-collector (staging).
# Builds the Dockerfile here, pushes to ghcr.io/theprintspace/signoz-
# otel-collector:<sha>, then points the Railway `otel-collector` service at
# the new image and triggers a deploy via inline GraphQL calls.
#
# Public Repo / GHCR: this repo is public; GHCR auto-publishes the package
# as public, no registry-credentials needed for Railway pull.
#
# Custom domain: signoz-otelcol.staging.creativehub.io (also reachable
# internally at otel-collector.railway.internal:4317/grpc + 4318/http).
# Auth: bearertokenauth on both protocols, token is SIGNOZ_INGEST_TOKEN.
#
# Required setup:
#   1. Repo secret OP_SERVICE_ACCOUNT_TOKEN — staging SA from Engineering
#      vault → "Service Account Auth Token: infrastructure staging service
#      account", field `credential`.
#   2. 1Password vault `tps-infra-staging`:
#        railway/api-token, railway/project-id, railway/environment-id
#        railway/services/otel-collector
#        signoz/ingest-token  (shared with vercel-otlp + platform-metrics-poller)

env:
  IMAGE_REPO: ghcr.io/theprintspace/signoz-otel-collector
  RAILWAY_GRAPHQL: https://backboard.railway.com/graphql/v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load secrets from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          VAULT='tps-infra-staging'

          read_secret() {
            local title="$1"
            local val
            val=$(op item get "$title" --vault "$VAULT" --fields password --reveal 2>/dev/null || true)
            if [ -z "$val" ]; then
              echo "::error::Required vault item '$title' missing or empty in $VAULT" >&2
              return 1
            fi
            echo "$val"
          }

          RAILWAY_TOKEN=$(read_secret 'railway/api-token')
          PROJECT_ID=$(read_secret 'railway/project-id')
          ENVIRONMENT_ID=$(read_secret 'railway/environment-id')
          SERVICE_ID=$(read_secret 'railway/services/otel-collector')
          INGEST_TOKEN=$(read_secret 'signoz/ingest-token')

          for v in "$RAILWAY_TOKEN" "$INGEST_TOKEN"; do
            echo "::add-mask::$v"
          done

          {
            echo "RAILWAY_TOKEN=$RAILWAY_TOKEN"
            echo "PROJECT_ID=$PROJECT_ID"
            echo "ENVIRONMENT_ID=$ENVIRONMENT_ID"
            echo "SERVICE_ID=$SERVICE_ID"
            echo "INGEST_TOKEN=$INGEST_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Sync env vars to Railway
        run: |
          set -euo pipefail
          ENVVARS=$(jq -nc \
            --arg ingest "$INGEST_TOKEN" \
            '{
              SIGNOZ_INGEST_TOKEN: $ingest,
              CLICKHOUSE_HOST: "clickhouse.railway.internal",
              LOW_CARDINAL_EXCEPTION_GROUPING: "false",
              PORT: "4318"
            }')
          # PORT=4318 tells Railway to route the public custom-domain HTTPS
          # to the OTLP HTTP receiver (port 4318) instead of the default
          # first-EXPOSE port (4317, gRPC). gRPC isn't reachable through
          # Railway's HTTPS edge so external OTLP/HTTP clients (e.g. direct
          # OTLP from a browser SDK or external service) need port 4318.
          # Internal *.railway.internal traffic to either port works
          # regardless because internal DNS doesn't go through the edge.

          VARS_GQL=$(echo "$ENVVARS" | jq -r '
            to_entries | map(
              (.key | gsub("\""; "\\\"")) + ": " +
              (.value | tojson)
            ) | join(", ")
          ')

          body=$(jq -nc \
            --arg pid "$PROJECT_ID" --arg eid "$ENVIRONMENT_ID" --arg sid "$SERVICE_ID" \
            --arg vars "$VARS_GQL" \
            '{query: "mutation { variableCollectionUpsert(input: { projectId: \"\($pid)\", environmentId: \"\($eid)\", serviceId: \"\($sid)\", replace: false, variables: { \($vars) } }) }"}')
          response=$(curl -fsS -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" -d "$body")
          if echo "$response" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::variableCollectionUpsert: $(echo "$response" | jq -r '.errors[0].message')"
            exit 1
          fi
          echo "::notice::Synced $(echo "$ENVVARS" | jq 'length') env vars"

      - name: Update Railway service source + deploy
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
        run: |
          set -euo pipefail
          source_input=$(jq -nc --arg img "$IMAGE" '{image: $img}')
          input_obj=$(jq -nc --argjson src "$source_input" '{source: $src}')
          body=$(jq -nc \
            --arg eid "$ENVIRONMENT_ID" --arg sid "$SERVICE_ID" \
            --argjson input "$input_obj" \
            '{
              query: "mutation($eid: String!, $sid: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $eid, serviceId: $sid, input: $input) }",
              variables: { eid: $eid, sid: $sid, input: $input }
            }')
          response=$(curl -fsS -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" -d "$body")
          if echo "$response" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::serviceInstanceUpdate: $(echo "$response" | jq -r '.errors[0].message')"
            exit 1
          fi
          echo "::notice::Updated source → $IMAGE"

          body=$(jq -nc \
            --arg eid "$ENVIRONMENT_ID" --arg sid "$SERVICE_ID" \
            '{query: "mutation { serviceInstanceDeploy(environmentId: \"\($eid)\", serviceId: \"\($sid)\") }"}')
          response=$(curl -fsS -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" -d "$body")
          if echo "$response" | jq -e '.errors' > /dev/null 2>&1; then
            msg=$(echo "$response" | jq -r '.errors[0].message')
            echo "::warning::serviceInstanceDeploy: $msg (likely already deploying)"
          else
            echo "::notice::Deploy triggered"
          fi
